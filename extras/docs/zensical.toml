# More info on available options:
# https://zensical.org/docs/setup/basics/#settings

[project]
site_name = "SideXP - CtrlDS4 (Arduino)"
site_description = "Arduino library that makes a board with native USB appear to the host as a DualShock 4 controller."
site_author = "Sideways Experiments"
copyright = """
&copy; 2026 <a href="https://sideways-experiments.com">Sideways Experiments</a>
"""

# Source MarkDown files and generated website output. Both are resolved relative to this file.
# The sources have their own folder, so the configuration files next to this one aren't published.
docs_dir = "pages"
site_dir = "site"

# Scripts and stylesheets added to every page, relative to docs_dir. The controller tester only
# sets itself up on the page that has one (see pages/tester.md).
extra_javascript = ["assets/javascripts/gamepadTester.js"]
extra_css = ["assets/stylesheets/gamepadTester.css"]

[project.theme]
name = "side-xp"
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# More about extensions:
# https://zensical.org/docs/setup/extensions/
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
